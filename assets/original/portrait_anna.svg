<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#18120d"/>
  <rect x="20" y="20" width="260" height="260" fill="#120c08" rx="8"/>
  <rect x="30" y="30" width="240" height="180" fill="#0c0805" rx="4"/>

  <!-- Veiled Female Silhouette in Chiaroscuro Noir -->
  <g fill="#070403">
    <!-- Updo hair and mourning veil outline -->
    <circle cx="150" cy="95" r="32"/>
    <path d="M115 100 Q150 70 185 100 L200 180 Q150 195 100 180 Z" fill="#0f0a07" fill-opacity="0.8"/>
    <!-- Shoulders -->
    <path d="M125 125 L85 170 L55 210 L245 210 L215 170 L175 125 Z"/>
  </g>

  <!-- Fine lace veil hatching lines -->
  <g stroke="#241a13" stroke-width="1" stroke-dasharray="2,3" opacity="0.6">
    <line x1="110" y1="120" x2="190" y2="120"/>
    <line x1="105" y1="140" x2="195" y2="140"/>
    <line x1="115" y1="160" x2="185" y2="160"/>
  </g>

  <!-- Fingerprint Impression -->
  <g transform="translate(40, 220)" stroke="#806245" stroke-width="1.2" fill="none" opacity="0.75">
    <ellipse cx="20" cy="25" rx="14" ry="20"/>
    <ellipse cx="20" cy="25" rx="10" ry="15"/>
    <ellipse cx="20" cy="25" rx="6" ry="10"/>
  </g>

  <!-- Red Archival Stamp: ФИГУРАНТКА -->
  <g transform="translate(180, 215) rotate(-6)">
    <rect x="0" y="0" width="80" height="26" fill="#8f281e" rx="4"/>
    <text x="40" y="17" fill="#fff" font-family="'Courier New', monospace" font-size="8" font-weight="bold" text-anchor="middle">ФИГУРАНТКА</text>
  </g>

  <!-- Typed Dossier Label -->
  <text x="80" y="242" fill="#e8d5bf" font-family="'Courier New', monospace" font-size="10" font-weight="bold">ВЕЙССЪ А.В.</text>
  <text x="80" y="258" fill="#998169" font-family="'Courier New', monospace" font-size="8">ВДОВА • МОТИВ: НАСЛЕДСТВО</text>
</svg>
