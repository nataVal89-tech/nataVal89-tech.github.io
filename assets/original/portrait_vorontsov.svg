<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#18120d"/>
  <rect x="20" y="20" width="260" height="260" fill="#120c08" rx="8"/>
  <rect x="30" y="30" width="240" height="180" fill="#0c0805" rx="4"/>

  <!-- Aristocrat Silhouette with Monocle -->
  <g fill="#070403">
    <!-- Styled hair and head -->
    <path d="M120 110 C118 65, 135 50, 150 50 C165 50, 182 65, 180 110 Z"/>
    <ellipse cx="150" cy="98" rx="30" ry="38"/>
    <!-- Stiff standing collar and coat -->
    <path d="M130 135 L90 170 L60 210 L240 210 L210 170 L170 135 Z"/>
    <polygon points="140,135 150,155 160,135" fill="#f0e2d3"/>
    <!-- Monocle Golden Glint -->
    <circle cx="160" cy="95" r="9" fill="none" stroke="#d4a34b" stroke-width="1.8"/>
    <line x1="168" y1="100" x2="175" y2="135" stroke="#d4a34b" stroke-width="1"/>
  </g>

  <!-- Fingerprint Impression -->
  <g transform="translate(40, 220)" stroke="#806245" stroke-width="1.2" fill="none" opacity="0.75">
    <ellipse cx="20" cy="25" rx="14" ry="20"/>
    <ellipse cx="20" cy="25" rx="10" ry="15"/>
    <ellipse cx="20" cy="25" rx="6" ry="10"/>
  </g>

  <!-- Aristocratic Seal: АНГЛИЙСКИЙ КЛУБЪ -->
  <g transform="translate(185, 212) rotate(-5)">
    <circle cx="32" cy="32" r="30" fill="#241b2b"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="#baa0c7" stroke-width="1.5"/>
    <text x="32" y="28" fill="#d9c7e3" font-family="'Courier New', monospace" font-size="7" font-weight="bold" text-anchor="middle">АНГЛIЙСКIЙ</text>
    <text x="32" y="40" fill="#d9c7e3" font-family="'Courier New', monospace" font-size="7" font-weight="bold" text-anchor="middle">КЛУБЪ</text>
  </g>

  <!-- Typed Dossier Label -->
  <text x="80" y="242" fill="#e8d5bf" font-family="'Courier New', monospace" font-size="10" font-weight="bold">ГРАФЪ ВОРОНЦОВЪ</text>
  <text x="80" y="258" fill="#998169" font-family="'Courier New', monospace" font-size="8">ВЛАДЕЛЕЦ ЧАСОВ • АЛИБИ ПОДТВЕРЖДЕНО</text>
</svg>
