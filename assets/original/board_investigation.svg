<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <radialGradient id="corkGlow" cx="400" cy="150" r="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c1e14"/>
      <stop offset="70%" stop-color="#18110b"/>
      <stop offset="100%" stop-color="#0d0906"/>
    </radialGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="300" fill="url(#corkGlow)"/>

  <!-- Cork Texture Stippling -->
  <g fill="#21160d" opacity="0.6">
    <circle cx="80" cy="40" r="2"/><circle cx="160" cy="120" r="1.5"/><circle cx="240" cy="70" r="2"/>
    <circle cx="360" cy="190" r="1.5"/><circle cx="500" cy="80" r="2"/><circle cx="620" cy="210" r="1.5"/>
    <circle cx="710" cy="60" r="2"/><circle cx="120" cy="240" r="2"/><circle cx="430" cy="40" r="1.5"/>
  </g>

  <!-- Pinned Notes and Case Cards -->
  <!-- Note 1: Left -->
  <g transform="translate(70, 50) rotate(-4)">
    <rect x="0" y="0" width="130" height="150" fill="#ded0ba" rx="2" stroke="#423120" stroke-width="1"/>
    <line x1="15" y1="30" x2="115" y2="30" stroke="#332415" stroke-width="2"/>
    <line x1="15" y1="45" x2="100" y2="45" stroke="#7a634e" stroke-width="1.5"/>
    <line x1="15" y1="60" x2="110" y2="60" stroke="#7a634e" stroke-width="1.5"/>
    <rect x="15" y="80" width="100" height="50" fill="#241a12"/>
    <circle cx="65" cy="5" r="5" fill="#e6392a"/>
  </g>

  <!-- Note 2: Center -->
  <g transform="translate(320, 40) rotate(2)">
    <rect x="0" y="0" width="160" height="180" fill="#ebd9c0" rx="2" stroke="#423120" stroke-width="1"/>
    <text x="15" y="25" fill="#3b2b1a" font-family="Georgia, serif" font-size="10" font-weight="bold">ВЕЩЕСТВЕННЫЙ АРХИВ</text>
    <line x1="15" y1="35" x2="145" y2="35" stroke="#c43b2d" stroke-width="1.5"/>
    <rect x="15" y="50" width="130" height="75" fill="#140e0a"/>
    <text x="25" y="145" fill="#4d3b2a" font-family="monospace" font-size="9">ЦИАНИСТЫЙ КАЛIЙ</text>
    <text x="25" y="160" fill="#4d3b2a" font-family="monospace" font-size="9">ВРЕМЯ: 20:45</text>
    <circle cx="80" cy="5" r="5" fill="#e6392a"/>
  </g>

  <!-- Note 3: Right -->
  <g transform="translate(580, 60) rotate(-3)">
    <rect x="0" y="0" width="140" height="160" fill="#dbc5a8" rx="2" stroke="#423120" stroke-width="1"/>
    <line x1="15" y1="30" x2="125" y2="30" stroke="#332415" stroke-width="2"/>
    <line x1="15" y1="50" x2="110" y2="50" stroke="#7a634e" stroke-width="1.5"/>
    <rect x="15" y="70" width="110" height="60" fill="#241a12"/>
    <circle cx="70" cy="5" r="5" fill="#e6392a"/>
  </g>

  <!-- Red String Connections (Красные нити) -->
  <g filter="url(#crimsonGlow)">
    <path d="M 135 55 Q 260 140 400 45" stroke="#e6392a" stroke-width="2.5" fill="none"/>
    <path d="M 400 45 Q 520 160 650 65" stroke="#e6392a" stroke-width="2.5" fill="none"/>
    <path d="M 135 55 Q 380 230 650 65" stroke="#d92517" stroke-width="1.8" fill="none" stroke-dasharray="8,4"/>
  </g>

  <!-- Title Watermark -->
  <text x="400" y="275" fill="#806b56" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="3" text-anchor="middle" opacity="0.6">ДОСКА РАССЛЕДОВАНИЯ • СВЯЗИ УЛИК</text>
</svg>
