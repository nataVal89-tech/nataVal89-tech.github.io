<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="c1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a0f"/>
      <stop offset="60%" stop-color="#24101b"/>
      <stop offset="100%" stop-color="#0a0508"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#c1bg)"/>
  <!-- Velvet Theatre Curtains & Stage Silhouette -->
  <path d="M0 0 L140 0 Q90 180 0 360 Z" fill="#3b111e"/>
  <path d="M600 0 L460 0 Q510 180 600 360 Z" fill="#3b111e"/>
  <!-- Stage light cone & Cut Rope with Falling Chandelier -->
  <polygon points="360,0 260,360 480,360" fill="#fff5d6" fill-opacity="0.12"/>
  <!-- Cut Rope with Red Thread Accent -->
  <g transform="translate(360, 80)">
    <line x1="0" y1="-80" x2="0" y2="40" stroke="#a38262" stroke-width="4"/>
    <line x1="0" y1="40" x2="-8" y2="48" stroke="#a38262" stroke-width="2"/>
    <line x1="0" y1="40" x2="6" y2="52" stroke="#a38262" stroke-width="2"/>
    <!-- Blood/Cut Mark in Red -->
    <circle cx="0" cy="40" r="6" fill="#e6392a"/>
    <!-- Ballerina Silhouette on stage -->
    <g transform="translate(40, 120)">
      <circle cx="0" cy="-25" r="7" fill="#dbc0b4"/>
      <path d="M-8 -15 L8 -15 L14 15 L-14 15 Z" fill="#f0dbd3"/>
      <ellipse cx="0" cy="18" rx="26" ry="8" fill="#f5ebe6"/>
      <line x1="-5" y1="24" x2="-8" y2="65" stroke="#dbc0b4" stroke-width="3"/>
      <line x1="5" y1="24" x2="14" y2="60" stroke="#dbc0b4" stroke-width="3"/>
    </g>
  </g>
  <!-- Typography -->
  <text x="40" y="70" fill="#d94a38" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="2">ИСТОРИЧЕСКИЙ ДЕТЕКТИВ • 1903</text>
  <text x="40" y="115" fill="#fcecd9" font-family="Georgia, serif" font-size="28" font-weight="bold">Призрак Мариинского театра</text>
  <text x="40" y="148" fill="#bfa891" font-family="sans-serif" font-size="14">Роковое падение прима-балерины на премьере</text>
</svg>
