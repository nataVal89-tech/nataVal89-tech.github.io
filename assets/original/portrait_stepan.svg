<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <rect width="300" height="300" fill="#18120d"/>
  <rect x="20" y="20" width="260" height="260" fill="#120c08" rx="8"/>
  <rect x="30" y="30" width="240" height="180" fill="#0c0805" rx="4"/>

  <!-- Young Apprentice Silhouette -->
  <g fill="#070403">
    <!-- Tousled hair and head -->
    <path d="M125 110 C120 70, 135 55, 150 55 C165 55, 180 70, 175 110 Z"/>
    <ellipse cx="150" cy="100" rx="30" ry="38"/>
    <!-- Unbuttoned collar vest -->
    <path d="M130 135 L90 170 L65 210 L235 210 L210 170 L170 135 Z"/>
    <polygon points="140,140 150,165 160,140" fill="#170f09"/>
  </g>

  <!-- Fingerprint Impression -->
  <g transform="translate(40, 220)" stroke="#806245" stroke-width="1.2" fill="none" opacity="0.75">
    <ellipse cx="20" cy="25" rx="14" ry="20"/>
    <ellipse cx="20" cy="25" rx="10" ry="15"/>
    <ellipse cx="20" cy="25" rx="6" ry="10"/>
  </g>

  <!-- Billiard Club Stamp: СТРѢЛА -->
  <g transform="translate(190, 212) rotate(6)">
    <circle cx="32" cy="32" r="30" fill="#2d2015"/>
    <circle cx="32" cy="32" r="26" fill="none" stroke="#d49b45" stroke-width="1.5"/>
    <text x="32" y="30" fill="#d49b45" font-family="'Courier New', monospace" font-size="8" font-weight="bold" text-anchor="middle">КЛУБЪ</text>
    <text x="32" y="42" fill="#d49b45" font-family="'Courier New', monospace" font-size="7" font-weight="bold" text-anchor="middle">СТРѢЛА</text>
  </g>

  <!-- Typed Dossier Label -->
  <text x="80" y="242" fill="#e8d5bf" font-family="'Courier New', monospace" font-size="10" font-weight="bold">КОЛЬЦОВЪ С.А.</text>
  <text x="80" y="258" fill="#998169" font-family="'Courier New', monospace" font-size="8">ПОДМАСТЕРЬЕ • КРАЖА 50 Р.</text>
</svg>
