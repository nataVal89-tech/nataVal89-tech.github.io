<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="c2bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1214"/>
      <stop offset="60%" stop-color="#141e21"/>
      <stop offset="100%" stop-color="#070b0d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#c2bg)"/>
  <!-- Victorian Gentlemen's Club Library & Leather Armchair -->
  <g transform="translate(420, 160)">
    <!-- Bookcase backdrop -->
    <rect x="-100" y="-120" width="200" height="240" fill="#1b120c" stroke="#0a0705" stroke-width="4"/>
    <line x1="-100" y1="-50" x2="100" y2="-50" stroke="#0a0705" stroke-width="3"/>
    <line x1="-100" y1="20" x2="100" y2="20" stroke="#0a0705" stroke-width="3"/>
    <line x1="-100" y1="90" x2="100" y2="90" stroke="#0a0705" stroke-width="3"/>
    <!-- Books in shelves -->
    <rect x="-90" y="-110" width="18" height="55" fill="#522416"/><rect x="-70" y="-115" width="22" height="60" fill="#16382b"/>
    <rect x="-45" y="-105" width="15" height="50" fill="#4d3a17"/><rect x="40" y="-112" width="24" height="58" fill="#541b23"/>
    <!-- Empty Leather Armchair Silhouette with Fallen Pipe & Smoke -->
    <path d="M-40 40 L-55 110 L55 110 L40 40 Z" fill="#29160d"/>
    <ellipse cx="0" cy="40" rx="45" ry="20" fill="#382014"/>
    <!-- Single Red Bullet Hole & Crack (Выстрел без звука) -->
    <circle cx="20" cy="-20" r="5" fill="#e6392a"/>
    <path d="M20 -20 L35 -35 M20 -20 L10 -40 M20 -20 L38 -15" stroke="#e6392a" stroke-width="1.5"/>
  </g>
  <!-- Typography -->
  <text x="40" y="70" fill="#d94a38" font-family="Georgia, serif" font-size="12" font-weight="bold" letter-spacing="2">ИСТОРИЧЕСКИЙ ДЕТЕКТИВ • 1895</text>
  <text x="40" y="115" fill="#fcecd9" font-family="Georgia, serif" font-size="28" font-weight="bold">Выстрел в клубе "Диоген"</text>
  <text x="40" y="148" fill="#bfa891" font-family="sans-serif" font-size="14">Молчаливая смерть лорда в клубе тишины</text>
</svg>
