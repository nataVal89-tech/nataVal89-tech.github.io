<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <radialGradient id="lampLight" cx="600" cy="100" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5c056" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#b86b23" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#3d1f0d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0705" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0705" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#120c08" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0a0705" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Deep Black/Charcoal Base -->
  <rect width="800" height="400" fill="#090605"/>

  <!-- Distant St. Petersburg Rooftops & Domes Silhouette -->
  <path d="M0 260 L60 260 L60 170 L110 170 L110 260 L180 260 L180 200 L240 180 L240 260 L350 260 L380 140 Q400 110 420 140 L450 260 L520 260 L520 190 L570 190 L570 260 L800 260 L800 400 L0 400 Z" fill="#0e0a07"/>

  <!-- Street Lamp Cone -->
  <circle cx="600" cy="100" r="300" fill="url(#lampLight)"/>

  <!-- Rain Reflections on Wet Cobblestones -->
  <g opacity="0.35">
    <ellipse cx="600" cy="350" rx="140" ry="25" fill="#f5c056" opacity="0.25"/>
    <line x1="120" y1="330" x2="260" y2="330" stroke="#a37a4e" stroke-width="2" stroke-linecap="round"/>
    <line x1="340" y1="365" x2="480" y2="365" stroke="#f5c056" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="520" y1="340" x2="680" y2="340" stroke="#ffd980" stroke-width="3" stroke-linecap="round"/>
    <line x1="220" y1="380" x2="380" y2="380" stroke="#b8834d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Vintage Streetlamp Silhouette -->
  <g stroke="#090605" stroke-width="5" fill="none">
    <line x1="600" y1="360" x2="600" y2="90"/>
    <circle cx="600" cy="85" r="15" fill="#fff5d4" stroke="#f5c056" stroke-width="4"/>
    <path d="M580 90 L620 90 M585 70 L615 70 L600 50 Z" fill="#090605"/>
  </g>

  <!-- Sharp Noir Detective Silhouette (Atmospheric True Detective Stance) -->
  <g fill="#050302">
    <!-- Fedora hat -->
    <path d="M340 165 C340 145 355 130 375 130 C395 130 410 145 410 165 Z"/>
    <ellipse cx="375" cy="165" rx="42" ry="9"/>
    <!-- Overcoat silhouette with popped collar -->
    <path d="M352 170 L330 205 L310 350 L440 350 L420 205 L398 170 Z"/>
    <path d="M335 345 L325 388 L345 390 L358 350 Z"/>
    <path d="M392 345 L405 388 L425 386 L412 348 Z"/>
  </g>

  <!-- Crimson Conspiracy Thread & Forensic Pins -->
  <g>
    <path d="M140 220 Q280 270 375 180 T600 85" stroke="#e6392a" stroke-width="2.2" fill="none" stroke-dasharray="8,4"/>
    <path d="M220 330 Q310 260 375 310 T560 190" stroke="#d92517" stroke-width="1.8" fill="none"/>
    <circle cx="140" cy="220" r="4.5" fill="#ff3b30"/>
    <circle cx="375" cy="180" r="5" fill="#ff3b30"/>
    <circle cx="560" cy="190" r="4.5" fill="#ff3b30"/>
  </g>

  <!-- Dark Foreground Fog Vignette -->
  <rect width="800" height="400" fill="url(#fogGrad)"/>

  <!-- St. Petersburg Police Department Seal Watermark -->
  <g transform="translate(40, 40)" opacity="0.85">
    <rect x="0" y="0" width="220" height="28" rx="6" fill="#120c08" fill-opacity="0.9"/>
    <circle cx="14" cy="14" r="4" fill="#e6392a"/>
    <text x="26" y="18" fill="#e8d5be" font-family="'Playfair Display', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="2">СЫСКНАЯ ПОЛИЦИЯ • 1899</text>
  </g>
</svg>
