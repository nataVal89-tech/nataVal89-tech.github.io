<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Aged Archive Dossier Paper Backdrop -->
  <rect width="300" height="300" fill="#18120d"/>
  
  <!-- Dossier Photo Frame -->
  <rect x="20" y="20" width="260" height="260" fill="#120c08" rx="8"/>
  <rect x="30" y="30" width="240" height="180" fill="#0c0805" rx="4"/>

  <!-- Mystery Detective Silhouette in Chiaroscuro Noir -->
  <g fill="#060403">
    <!-- Fedora hat -->
    <path d="M110 95 C110 75, 125 60, 150 60 C175 60, 190 75, 190 95 Z"/>
    <ellipse cx="150" cy="95" rx="55" ry="12"/>
    <!-- Coat silhouette -->
    <path d="M125 105 L95 150 L60 210 L240 210 L205 150 L175 105 Z"/>
    <!-- Popped collar triangle -->
    <polygon points="135,115 150,140 165,115 150,130" fill="#1c140d"/>
  </g>

  <!-- Dramatic light beam across face -->
  <polygon points="120,30 180,30 210,210 150,210" fill="#f5c056" fill-opacity="0.08"/>

  <!-- Fingerprint Impression (Дактилоскопия) -->
  <g transform="translate(40, 220)" stroke="#806245" stroke-width="1.2" fill="none" opacity="0.75">
    <ellipse cx="20" cy="25" rx="14" ry="20"/>
    <ellipse cx="20" cy="25" rx="10" ry="15"/>
    <ellipse cx="20" cy="25" rx="6" ry="10"/>
    <path d="M15 15 Q20 8 25 15 Q22 35 16 35"/>
  </g>

  <!-- Red Wax Seal Stamp: СЫСКНОЕ ОТДЕЛЕНИЕ -->
  <g transform="translate(190, 210) rotate(-8)">
    <circle cx="35" cy="35" r="32" fill="#8f281e" fill-opacity="0.9"/>
    <circle cx="35" cy="35" r="28" fill="none" stroke="#e8a29b" stroke-width="1.5"/>
    <text x="35" y="30" fill="#fae8e6" font-family="'Courier New', monospace" font-size="8" font-weight="bold" text-anchor="middle">СЫСКЪ СПб</text>
    <text x="35" y="42" fill="#fae8e6" font-family="'Courier New', monospace" font-size="9" font-weight="bold" text-anchor="middle">№ 8412</text>
  </g>

  <!-- Typed Dossier Label -->
  <text x="80" y="242" fill="#e8d5bf" font-family="'Courier New', monospace" font-size="10" font-weight="bold">ДЕЛО: СЛЕДОВАТЕЛЬ</text>
  <text x="80" y="258" fill="#998169" font-family="'Courier New', monospace" font-size="8">ОСОБЫЙ ОТДѢЛЪ СЫСКА</text>
</svg>
