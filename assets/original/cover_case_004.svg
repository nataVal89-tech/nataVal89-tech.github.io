<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="c4bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="60%" stop-color="#0f1929"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#c4bg)"/>
  <!-- Modern Digital Crime Scene: Fontanka River Embankment & Cyber HUD Grid -->
  <g transform="translate(380, 160)" opacity="0.35">
    <line x1="-120" y1="0" x2="180" y2="0" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="-120" y1="60" x2="180" y2="60" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="-120" y1="-60" x2="180" y2="-60" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="20" cy="0" r="50" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="-90" y="-80" fill="#60a5fa" font-family="monospace" font-size="11">LAT 59.9311° N / LON 30.3609° E</text>
  </g>
  <!-- Forensic Evidence Marker with Red Digital Code & Glass Bridge -->
  <g transform="translate(420, 150)">
    <polygon points="0,-40 35,25 -35,25" fill="#facc15" stroke="#713f12" stroke-width="3"/>
    <text x="0" y="16" fill="#000" font-family="sans-serif" font-size="24" font-weight="900" text-anchor="middle">#1</text>
    <!-- Broken Smartphone / Encrypted Flash Drive with red laser line -->
    <rect x="50" y="0" width="30" height="55" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <line x1="50" y1="20" x2="80" y2="20" stroke="#ef4444" stroke-width="3"/>
    <path d="M-80 50 Q20 30 140 70" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  </g>
  <!-- Typography -->
  <text x="40" y="70" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="2">СОВРЕМЕННЫЙ ТРИЛЛЕР • 2024</text>
  <text x="40" y="115" fill="#f8fafc" font-family="sans-serif" font-size="28" font-weight="bold">Шифр на Фонтанке</text>
  <text x="40" y="148" fill="#94a3b8" font-family="sans-serif" font-size="14">Смерть IT-инвестора и зашифрованный сервер в пентхаусе</text>
</svg>
